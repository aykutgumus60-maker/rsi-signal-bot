name: Futures Metrikleri Botu

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-futures-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: pip install requests
      - name: Kontrolü çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python futures_metrics_bot.py
      - name: Durum dosyasını repoya kaydet
        run: |
          git config user.name "futures-metrics-bot"
          git config user.email "futures-metrics-bot@users.noreply.github.com"
          git add futures_metrics_state.json || true
          git diff --cached --quiet || git commit -m "state güncellendi [skip ci]"
          git push || true
