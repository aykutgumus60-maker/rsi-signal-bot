name: Buyuk Alim Gecmis Testi

on:
  workflow_dispatch: {}

jobs:
  run-whale-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Testi çalıştır
        run: python whale_backtest.py
